# Somente para testes; não modifica o application.yml nem o banco MySQL real.
spring.datasource.url=jdbc:h2:mem:sprint_os;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.test-connection=false
logging.level.org.hibernate.SQL=WARN
logging.level.br.com.sistemaos=WARN
