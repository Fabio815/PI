# Esse arquivo faz o mesmo trabalho do application.properties
# porém traz uma forma mais fácil de entender
# O application é como se fosse a central de configuração do Spring
# Nele posso definir configurações como: banco de dados, porta do servidor, logs, etc.

spring:
  application:
    name: sistemaos

  datasource:
    # Configuração MySQL
    # url: jdbc:mysql://localhost:3306/bike_facil
    # username: root
    # password: root

    # Configuração H2
    url: jdbc:h2:mem:bike_facil
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    # Dialect do MySQL
    # database-platform: org.hibernate.dialect.MySQLDialect

    # Dialect do H2
    database-platform: org.hibernate.dialect.H2Dialect

    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        show_sql: true
        format_sql: true

